<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="브라우저에서 로컬 영상을 컷 편집하고 자막·음성 기반 자동 컷을 적용해 MP4/WebM으로 내보내세요. 영상 파일은 서버로 업로드하지 않습니다."
    />
    <meta name="theme-color" content="#101010" />
    <meta name="application-name" content="Devianns Clip Maker" />
    <meta name="robots" content="index, follow" />
    <style>
      html, body { margin: 0; background: #101010; color: #ececec; }
      .boot-screen { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 24px; box-sizing: border-box; overflow: auto; background: #101010; font-family: system-ui, sans-serif; }
      .boot-screen[hidden] { display: none; }
      .boot-card { width: min(100%, 380px); margin: auto; text-align: center; }
      .boot-logo { width: 76px; height: 76px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 0 40px #ffd07812; }
      .boot-title { margin: 0 0 24px; font-size: clamp(20px, 5vw, 27px); font-weight: 650; letter-spacing: -0.6px; }
      .boot-progress { height: 3px; max-width: 240px; margin: 0 auto 18px; overflow: hidden; border-radius: 3px; background: #3c3c3c; }
      .boot-progress::after { content: ''; display: block; width: 38%; height: 100%; border-radius: inherit; background: #ffd078; animation: boot-slide 1.4s ease-in-out infinite; }
      .boot-description { margin: 0; font-size: 13px; line-height: 1.8; color: #bcbcbc; overflow-wrap: anywhere; }
      .boot-actions { margin-top: 20px; }
      .boot-actions[hidden] { display: none; }
      .boot-retry { min-height: 38px; padding: 8px 20px; border: 1px solid #ffd078; border-radius: 6px; background: #ffd078; color: #202020; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      .boot-retry:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      .boot-screen[data-state='error'] .boot-progress { background: #714b47; }
      .boot-screen[data-state='error'] .boot-progress::after { animation: none; width: 100%; background: #e9a19a; }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(370%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress::after { animation: none; width: 65%; } }
    </style>
    <script>
      (function () {
        var state = 'loading';
        var message = '편집기를 불러오는 중입니다…';
        var timeout;
        function paint() {
          var screen = document.getElementById('boot-screen');
          var status = document.getElementById('boot-status');
          var progress = document.getElementById('boot-progress');
          var actions = document.getElementById('boot-actions');
          if (!screen || !status || !progress || !actions) return;
          document.getElementById('boot-retry').onclick = function () { location.reload(); };
          screen.hidden = state === 'ready';
          screen.dataset.state = state;
          status.textContent = message;
          status.setAttribute('role', state === 'error' ? 'alert' : 'status');
          screen.setAttribute('aria-busy', String(state === 'loading'));
          progress.setAttribute('aria-hidden', String(state !== 'loading'));
          actions.hidden = state !== 'error';
        }
        function fail(text) {
          if (state !== 'loading') return;
          state = 'error'; message = text; clearTimeout(timeout); paint();
        }
        function resourceError(event) {
          var target = event.target;
          if (target instanceof HTMLScriptElement || (target instanceof HTMLLinkElement && target.rel === 'stylesheet')) {
            fail(navigator.onLine === false
              ? '인터넷 연결이 끊어져 편집기 파일을 불러오지 못했습니다. 연결 후 다시 시도해 주세요.'
              : '편집기 파일을 불러오지 못했습니다. 네트워크·서버 응답 또는 배포 파일 경로를 확인한 뒤 다시 시도해 주세요.');
          } else if (event instanceof ErrorEvent) {
            fail('편집기를 시작하는 중 오류가 발생했습니다. 다시 시도해 주세요. 반복되면 브라우저 업데이트와 배포 파일을 확인해 주세요.');
          }
        }
        function rejection() { fail('편집기 초기 준비를 완료하지 못했습니다. 연결 상태를 확인한 뒤 다시 시도해 주세요.'); }
        function offline() { fail('인터넷 연결이 끊어졌습니다. 연결 후 다시 시도해 주세요.'); }
        window.addEventListener('error', resourceError, true);
        window.addEventListener('unhandledrejection', rejection);
        window.addEventListener('offline', offline);
        window.__clipBoot = {
          preparing: function () { if (state === 'loading') { message = '편집 화면을 준비하는 중입니다…'; paint(); } },
          fail: function () { fail('편집 화면을 시작하지 못했습니다. 다시 시도해 주세요.'); },
          ready: function () {
            if (state !== 'loading') return;
            state = 'ready'; clearTimeout(timeout); paint();
            window.removeEventListener('error', resourceError, true);
            window.removeEventListener('unhandledrejection', rejection);
            window.removeEventListener('offline', offline);
          }
        };
        timeout = setTimeout(function () { fail('편집기를 불러오는 데 시간이 오래 걸리고 있습니다. 연결·서버 상태를 확인하고 다시 시도해 주세요.'); }, 45000);
        document.addEventListener('DOMContentLoaded', function () {
          paint();
        }, { once: true });
      })();
    </script>

  <body>
    <div id="boot-screen" class="boot-screen" data-state="loading" aria-busy="true" aria-label="편집기 시작">
      <div class="boot-card">
