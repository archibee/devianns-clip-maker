<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="로컬 파일로 만드는 브라우저 영상 편집기. 컷 편집, 자막, 원본 기반 내보내기."
    />
    <meta name="theme-color" content="#101318" />
    <title>Devianns Clip Maker · 로컬 영상 편집기</title>
    <script type="module" crossorigin src="./assets/index-CT1hLXEB.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-Cb4AM5Ez.js">
    <link rel="modulepreload" crossorigin href="./assets/media-BHiyzPpc.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DNZz-sSG.css">
  </head>
  <body>
    <div id="root">
      <p id="boot-status" role="status">Devianns Clip Maker를 불러오는 중입니다…</p>
    </div>
    <noscript>편집기를 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
    <script>
      // A broken deployment should explain the problem instead of showing an empty page.
      window.addEventListener(
        'error',
        function (event) {
          var status = document.getElementById('boot-status');
          if (
            status &&
            (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)
          ) {
            status.setAttribute('role', 'alert');
            status.textContent =
              '편집기 파일을 불러오지 못했습니다. 빌드된 dist 폴더가 배포되었는지와 파일 경로를 확인한 뒤 새로고침해 주세요.';
          }
        },
        true,
      );
    </script>
  </body>
</html>
